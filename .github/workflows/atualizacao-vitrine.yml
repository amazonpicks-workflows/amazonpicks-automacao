name: AmazonPicks — Atualização prioritária
on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Apenas validar a execução
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: amazonpicks-unified-price-refresh
  cancel-in-progress: false
jobs:
  execution:
    name: Atualização
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: Executar
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_DISPATCH_TOKEN }}
          VALIDATE_ONLY: ${{ inputs.validate_only }}
        run: |
          set -euo pipefail
          trap 'echo "Não foi possível concluir a execução. Consulte o diagnóstico privado."' ERR
          repository="amazonpicks-workflows/amazonpicks-next"
          workflow="routine-b.yml"
          jq -n --arg id "$GITHUB_RUN_ID" --argjson validate "$VALIDATE_ONLY" '{ref:"master",inputs:{request_id:$id,validate_only:$validate}}' > "$RUNNER_TEMP/request.json"
          gh api --method POST "repos/$repository/actions/workflows/$workflow/dispatches" --input "$RUNNER_TEMP/request.json" > /dev/null 2>&1
          echo "Execução solicitada."
          run_id=""
          for attempt in $(seq 1 20); do
            gh api "repos/$repository/actions/workflows/$workflow/runs?event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/status.json" 2>/dev/null
            run_id=$(jq -r --arg title "Rotina $GITHUB_RUN_ID" '[.workflow_runs[] | select(.display_title == $title)][0].id // empty' "$RUNNER_TEMP/status.json")
            if [ -n "$run_id" ]; then break; fi
            sleep 15
          done
          if [ -z "$run_id" ]; then exit 1; fi
          for attempt in $(seq 1 200); do
            gh api "repos/$repository/actions/runs/$run_id" > "$RUNNER_TEMP/status.json" 2>/dev/null
            status=$(jq -r '.status' "$RUNNER_TEMP/status.json")
            if [ "$status" = "completed" ]; then
              conclusion=$(jq -r '.conclusion' "$RUNNER_TEMP/status.json")
              if [ "$conclusion" = "success" ]; then echo "Execução concluída com sucesso."; exit 0; fi
              exit 1
            fi
            sleep 60
          done
          exit 1
