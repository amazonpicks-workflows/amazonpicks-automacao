name: AG
on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Apenas validar a execução
        type: boolean
        default: false
      failure_probe:
        description: Simular falha apenas na validação
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: amazonpicks-unified-price-refresh
  cancel-in-progress: false
jobs:
  execution:
    name: Atualização
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Preparar execução
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preparar ambiente
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      # Security policy must pass before production credentials enter a step.
      - name: Conferir proteção
        env:
          EXPECTED_POLICY_SHA256: ${{ vars.RUNNER_SECURITY_POLICY_SHA256 }}
        run: node .github/security/verify.mjs .
      - name: Executar
        shell: bash
        env:
          ROUTINE: a
          VALIDATE_ONLY: ${{ inputs.validate_only }}
          FAILURE_PROBE: ${{ inputs.failure_probe }}
          SOURCE_KEY: ${{ secrets.AMAZONPICKS_DEPLOY_KEY }}
          SOURCE_REPOSITORY: ${{ secrets.AUTOMATION_SOURCE_REPOSITORY }}
          DATABASE_URL: ${{ secrets.SUPLEMENTOS_DATABASE_URL }}
          AMAZON_PARTNER_TAG: ${{ secrets.SUPLEMENTOS_AMAZON_PARTNER_TAG }}
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.SUPLEMENTOS_AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.SUPLEMENTOS_AMAZON_CREATORS_CREDENTIAL_SECRET }}
          AMAZON_CREATORS_VERSION: ${{ secrets.SUPLEMENTOS_AMAZON_CREATORS_VERSION }}
          INTERNAL_REVALIDATE_SECRET: ${{ secrets.SUPLEMENTOS_INTERNAL_REVALIDATE_SECRET }}
          PUBLIC_FALLBACK_BUCKET: ${{ secrets.PUBLIC_FALLBACK_BUCKET }}
          PUBLIC_FALLBACK_REGION: ${{ secrets.PUBLIC_FALLBACK_REGION }}
          PUBLIC_FALLBACK_AWS_ACCESS_KEY_ID: ${{ secrets.PUBLIC_FALLBACK_AWS_ACCESS_KEY_ID }}
          PUBLIC_FALLBACK_AWS_SECRET_ACCESS_KEY: ${{ secrets.PUBLIC_FALLBACK_AWS_SECRET_ACCESS_KEY }}
        run: bash .github/workflows/execute.sh
