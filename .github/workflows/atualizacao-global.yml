name: AG
on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Apenas validar a execução
        type: boolean
        default: false
      failure_probe:
        description: Simular falha apenas na validação
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: managed-execution
  cancel-in-progress: false
jobs:
  execution:
    name: Execução
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Preparar execução
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preparar ambiente
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      # Security policy must pass before production credentials enter a step.
      - name: Conferir proteção
        env:
          EXPECTED_POLICY_SHA256: ${{ vars.RUNNER_SECURITY_POLICY_SHA256 }}
        run: node .github/security/verify.mjs .
      - name: Executar
        shell: bash
        env:
          ROUTINE: a
          VALIDATE_ONLY: ${{ inputs.validate_only }}
          FAILURE_PROBE: ${{ inputs.failure_probe }}
          EXECUTION_CONFIG: ${{ secrets.EXECUTION_CONFIG }}
        run: bash .github/workflows/execute.sh
